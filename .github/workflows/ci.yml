name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathblasters
          POSTGRES_PASSWORD: mathblasters
          POSTGRES_DB: mathblasters_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathblasters"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The service container publishes on 5432 on the runner itself.
      # TEST_DATABASE_URL is read by the pytest fixtures; DATABASE_URL by Alembic.
      TEST_DATABASE_URL: postgresql+psycopg://mathblasters:mathblasters@localhost:5432/mathblasters_test
      DATABASE_URL: postgresql+psycopg://mathblasters:mathblasters@localhost:5432/mathblasters_test

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Tests build the schema from the models for speed, so a model change
      # without a matching migration would otherwise go unnoticed. This fails
      # the build if models.py and alembic/versions/ have drifted apart.
      - name: Check migrations match models
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        run: pytest -q

  web:
    name: web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
